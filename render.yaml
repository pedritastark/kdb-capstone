databases:
  - name: dannytacos-db
    plan: free
    databaseName: dannytacos
    user: dannytacos

services:
  - type: web
    name: dannytacos-api
    runtime: node
    plan: free
    rootDir: server
    # preDeployCommand no está disponible en el plan free de Render, así que
    # la migración (idempotente — segura de repetir en cada deploy) se corre
    # como parte del build en vez de como paso aparte.
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dannytacos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # se completa a mano con la URL real del static site una vez creado

  - type: web
    name: dannytacos-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # se completa a mano con la URL real de dannytacos-api una vez creado
