# La base de datos NO vive en Render: es Postgres en Supabase (ver DEPLOY.md).
# Por eso este archivo ya no declara ninguna base; la API recibe DATABASE_URL a mano.
services:
  - type: web
    name: dannytacos-api
    runtime: node
    plan: free
    rootDir: server
    # preDeployCommand no está disponible en el plan free de Render, así que
    # la migración (idempotente — segura de repetir en cada deploy) se corre
    # como parte del build en vez de como paso aparte.
    # --include=dev es necesario porque NODE_ENV=production (abajo) hace que
    # "npm install" se salte devDependencies por defecto — y ahí viven
    # typescript/@types/*/tsx, que el build sí necesita.
    buildCommand: npm install --include=dev && npm run build && npm run migrate
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false # cadena del "Session pooler" de Supabase (Connect > Session pooler). Render es IPv4: NO usar la conexión directa.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # se completa a mano con la URL real del static site una vez creado
      - key: LOCAL_DIRECCION
        sync: false # dirección del local que el chatbot da a quien pasa a recoger (ej. "Calle 10 # 5-20, Laureles")

  - type: web
    name: dannytacos-frontend
    runtime: static
    # los Static Sites no tienen campo "plan" (son gratis siempre) — solo
    # los Web Services con cómputo (como dannytacos-api) lo necesitan.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # se completa a mano con la URL real de dannytacos-api una vez creado
      # Datos del negocio que muestra la landing (se pueden dejar vacíos: lo vacío no se muestra).
      - key: VITE_LOCAL_DIRECCION
        sync: false # ej. "Calle 10 # 5-20, Laureles, Medellín" (también alimenta el mapa)
      - key: VITE_TELEFONO
        sync: false
      - key: VITE_HORARIO
        sync: false
      - key: VITE_WHATSAPP_URL
        sync: false # ej. https://wa.me/573001234567 ; vacío = el botón lleva al chat web (/chat)
