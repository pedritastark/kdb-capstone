databases:
  - name: dannytacos-db
    plan: free
    databaseName: dannytacos
    user: dannytacos

services:
  - type: web
    name: dannytacos-api
    runtime: node
    plan: free
    rootDir: server
    # preDeployCommand no está disponible en el plan free de Render, así que
    # la migración (idempotente — segura de repetir en cada deploy) se corre
    # como parte del build en vez de como paso aparte.
    # --include=dev es necesario porque NODE_ENV=production (abajo) hace que
    # "npm install" se salte devDependencies por defecto — y ahí viven
    # typescript/@types/*/tsx, que el build sí necesita.
    buildCommand: npm install --include=dev && npm run build && npm run migrate
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dannytacos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # se completa a mano con la URL real del static site una vez creado

  - type: web
    name: dannytacos-frontend
    runtime: static
    # los Static Sites no tienen campo "plan" (son gratis siempre) — solo
    # los Web Services con cómputo (como dannytacos-api) lo necesitan.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # se completa a mano con la URL real de dannytacos-api una vez creado
